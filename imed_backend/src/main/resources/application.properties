spring.application.name=imed_backend
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/gestion_stages?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.packagesToScan=com.gestionstages.model
spring.jpa.open-in-view=false

# A remplacer par la variable JWT_SECRET en dehors du developpement.
# La valeur doit etre une cle Base64 d'au moins 256 bits.
app.jwt.secret=${JWT_SECRET:Z2VzdGlvbi1zdGFnZXMtand0LXNlY3JldC1kZXYtMjAyNi0wOA==}
app.jwt.expiration-ms=86400000

# Stockage privé des CV étudiants (PDF, 20 Mo maximum).
app.upload.cv-dir=${CV_UPLOAD_DIR:uploads/cv}
# Stockage privé des pièces jointes aux tâches assignées.
app.upload.tache-dir=${TACHE_UPLOAD_DIR:uploads/taches-assignees}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Activez temporairement ces variables pour créer le premier super administrateur.
# IMPORTANT : remettre enabled=false après le premier démarrage !
app.super-admin.enabled=true
app.super-admin.email=admin@imed.com
app.super-admin.password=123456789
app.super-admin.nom=Super
app.super-admin.prenom=Admin

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=INFO

# Configuration du microservice de recommandation Python
recommandation.service.url=http://localhost:8000
recommandation.service.endpoint.recommander=/recommander
recommandation.service.endpoint.health=/health
recommandation.service.timeout-seconds=10
